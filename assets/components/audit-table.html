<!-- ==========================================================================
     components/audit-table.html
     Reusable tabular audit list, built on the existing .dtable styles in
     assets/css/style.css. Used by history.html (see assets/js/history.js),
     which fetches rows from window.Api.audits.getRecent() and renders them
     with window.Components.renderAuditRow(audit) from assets/js/components.js.

     Optional loader: assets/js/include.js → Components.include('audit-table')
     ========================================================================== -->
<div class="card card__pad">
  <div class="card__head">
    <h3>Audit History</h3>
    <span class="card__head-sub" data-audit-table-count>— audits</span>
  </div>
  <div class="table-wrap">
    <table class="dtable" id="auditTable">
      <thead>
        <tr>
          <th>Website</th>
          <th>Scope</th>
          <th>Score</th>
          <th>Completed</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="auditTableBody">
        <!-- rows injected by assets/js/history.js via Components.renderAuditRow() -->
      </tbody>
    </table>
  </div>
</div>
