<!-- ==========================================================================
     components/header.html
     Authenticated app-shell topbar: menu toggle, search, notification bell,
     theme toggle, profile chip. Wired up by app.js (initSidebar,
     initThemeToggle, initProfileMenu, initNotificationBell).

     The search placeholder text differs slightly per page in the shipped
     app ("Search website or report…" vs "Search settings…") — when reusing
     this fragment, swap data-placeholder / the input's placeholder attribute
     to match the page.

     Optional loader: assets/js/include.js → Components.include('header')
     ========================================================================== -->
<header class="topbar">
  <div style="display:flex; align-items:center; gap:12px;">
    <button class="icon-btn menu-toggle" id="menuToggle" aria-label="Toggle menu" style="display:none;">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
    <div class="topbar__search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input type="text" placeholder="Search website or report…">
    </div>
  </div>
  <div class="topbar__actions">
    <button class="icon-btn" aria-label="Notifications">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
      <span class="dot"></span>
    </button>
    <div class="theme-toggle">
      <button aria-label="Light mode" class="is-active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
      <button aria-label="Dark mode"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z"/></svg></button>
    </div>
    <div class="profile-chip">
      <div class="profile-chip__avatar">?</div>
      <span class="profile-chip__name">…</span>
    </div>
  </div>
</header>
