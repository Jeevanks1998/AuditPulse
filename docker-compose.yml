version: "3.9"

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: auditpulse
      POSTGRES_PASSWORD: auditpulse
      POSTGRES_DB: auditpulse
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auditpulse"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: ./backend/.env.example
    environment:
      DATABASE_URL: postgresql+asyncpg://auditpulse:auditpulse@db:5432/auditpulse
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  frontend:
    image: python:3.12-slim
    working_dir: /site
    volumes:
      - ./:/site
    command: python -m http.server 5500
    ports:
      - "5500:5500"

volumes:
  pgdata:
