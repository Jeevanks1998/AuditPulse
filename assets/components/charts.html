<!-- Chart card. Put a <canvas> in .chart-canvas-wrap and draw with charts.js
     (Charts.renderRadar / renderTrendLine / renderSeverityDoughnut). Needs Chart.js loaded first.
     Optional loader: Components.include('charts') -->
<div class="card card__pad">
  <div class="card__head">
    <h3 data-chart-title>Chart title</h3>
    <span class="card__head-sub" data-chart-subtitle>Subtitle</span>
  </div>
  <div class="chart-canvas-wrap">
    <canvas id="genericChart" aria-label="Chart"></canvas>
  </div>
</div>
