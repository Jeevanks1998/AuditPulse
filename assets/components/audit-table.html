<!-- Audit table. Rows come from history.js (Components.renderAuditRow). Optional loader: Components.include('audit-table') -->
<div class="card card__pad">
  <div class="card__head">
    <h3>Audit History</h3>
    <span class="card__head-sub" data-audit-table-count>— audits</span>
  </div>
  <div class="table-wrap">
    <table class="dtable" id="auditTable">
      <thead>
        <tr>
          <th>Website</th>
          <th>Scope</th>
          <th>Score</th>
          <th>Completed</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="auditTableBody">
        <!-- rows added by history.js -->
      </tbody>
    </table>
  </div>
</div>
