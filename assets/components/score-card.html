<!-- ==========================================================================
     components/score-card.html
     Reusable "vitals ring" score card — the pattern used throughout the app
     (health overview on dashboard.html, category ring on report.html, etc).

     Static markup below is a filled-in example. To generate these from data
     instead of hand-editing HTML, use the JS template function:

       window.Components.renderScoreCard({ label: 'SEO', score: 95 })

     from assets/js/components.js, which returns the same markup as a string
     with the ring's stroke-dashoffset computed correctly for any score.

     Optional loader: assets/js/include.js → Components.include('score-card')
     ========================================================================== -->
<div class="score-cell" data-score-card data-label="SEO" data-score="95" role="button" tabindex="0">
  <div class="vring vring--sm" data-band="good">
    <svg width="64" height="64" viewBox="0 0 64 64">
      <circle class="vring__track" cx="32" cy="32" r="26" stroke-width="6"/>
      <circle class="vring__value" cx="32" cy="32" r="26" stroke-width="6" stroke-dasharray="163" stroke-dashoffset="8"/>
    </svg>
    <div class="vring__label">95</div>
  </div>
  <div class="score-cell__label">SEO</div>
</div>
