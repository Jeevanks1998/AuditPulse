<!-- Score ring card (example). To build from data use
     Components.renderScoreCard({ label: 'Analytics', score: 95 }).
     Optional loader: Components.include('score-card') -->
<div class="score-cell" data-score-card data-label="Analytics" data-score="95" role="button" tabindex="0">
  <div class="vring vring--sm" data-band="good">
    <svg width="64" height="64" viewBox="0 0 64 64">
      <circle class="vring__track" cx="32" cy="32" r="26" stroke-width="6"/>
      <circle class="vring__value" cx="32" cy="32" r="26" stroke-width="6" stroke-dasharray="163" stroke-dashoffset="8"/>
    </svg>
    <div class="vring__label">95</div>
  </div>
  <div class="score-cell__label">Analytics</div>
</div>
