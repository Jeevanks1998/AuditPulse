; alembic.ini
;
; Config for Alembic migrations. The env.py this points to (in
; database/migrations/) reads the actual DB connection from
; config.settings.settings.DATABASE_URL rather than the
; `sqlalchemy.url` below, so that .env / the environment stays the one
; source of truth for the connection string in every environment
; (local, CI, staging, prod). The value here only exists as an
; offline-mode fallback and for `alembic` CLI commands that print config
; before env.py runs.

[alembic]
script_location = database/migrations
prepend_sys_path = .
version_path_separator = os

sqlalchemy.url = postgresql+asyncpg://auditpulse:auditpulse@localhost:5432/auditpulse

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
